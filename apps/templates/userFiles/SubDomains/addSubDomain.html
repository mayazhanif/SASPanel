{% include "layout/header.html" %}
{% block body %}

            <div class="content-page">
                <div class="content">

                    <!-- Start Content-->
                    <div class="container-fluid">
                        <div class="row page-title">
                            <div class="col-md-12">
                                <nav aria-label="breadcrumb" class="float-right mt-1">
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="{{url_for('routes.user_dashboard') }}">Dashboard</a></li>
                                        <li class="breadcrumb-item"><a href="{{url_for('routes.user_viewEmail') }}">SubDomains</a></li>
                                        <li class="breadcrumb-item active">Add new Sub Domain</li>
                                    </ol>
                                </nav>
                                <h4 class="mb-1 mt-0">New Sub Domain</h4>
                            </div>
                        </div>


                            <div class="">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="header-title mt-0 mb-1">Add New Sub Domain</h4>
                                        <p class="sub-header">
                                            Select the Domain and its prefix to add Subdomain.
                                        </p>
                                        {% if msg %}
                                    <div class="alert alert-{{ msg.error }} alert-dismissible fade show" role="alert">
                                        {{ msg.message }}
                                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                        <span aria-hidden="true">×</span>
                                    </button>
                                </div>
                                {% endif %}
                                        <form method="POST" role="form" class="parsley-examples" autocomplete="off">
                                            <div class="form-group row">
                                                <label for="Domain" class="col-md-2 col-form-label">Domain<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                     <select name="domainID" id="domainID" class="custom-select mb-2">
                                                     <option selected="" value="">Select Domain</option>
                                                  {% if domains %}
                                                  {% for domain in domains %}
                                                     <option value="{{ domain[0] }}">{{ domain[1] }}</option>
                                                    {% endfor %}
                                                    {% endif %}
                                                  </select>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="suffix" class="col-md-2 col-form-label">Subdomain<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="Text" autocomplete="disabled" onkeydown="return /[a-z]/i.test(event.key)" required parsley-type="Text" class="form-control"
                                                            id="suffix" pattern="[^\s]+" name="suffix" placeholder="support.domain.com">
                                                </div>
                                            </div>

                                            <div class="form-group row">
                                                <div class="col-md-8 offset-md-4">
                                                    <button type="submit" class="btn btn-primary mr-1">
                                                        Add Sub Domain
                                                    </button>
                                                    <button type="reset"
                                                            class="btn btn-secondary">
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div> <!-- end card -->

                            </div> <!-- end col -->
                        </div>
                        <!-- end row -->



{% include "layout/footer.html" %}
{% endblock %}
