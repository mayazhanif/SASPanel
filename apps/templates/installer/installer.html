<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Installer - SASPanel Web Hosting Control Panel</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
        <meta content="Coderthemes" name="author" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        
        <!-- App favicon -->
        <link rel="shortcut icon" href="/assets/images/favicon.ico">

        <!-- App css -->
        <link href="/assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
        <link href="/assets/css/app.min.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" href="/assets/libs/smartwizard/smart_wizard.min.css" type="text/css" />
        <link rel="stylesheet" href="/assets/libs/smartwizard/smart_wizard_theme_arrows.min.css" type="text/css" />
        <link rel="stylesheet" href="/assets/libs/smartwizard/smart_wizard_theme_circles.min.css" type="text/css" />
        <link rel="stylesheet" href="/assets/libs/smartwizard/smart_wizard_theme_dots.min.css" type="text/css" />
    </head>

    <body class="authentication-bg">

        <div class="account-pages my-5">
            <div class="container">

                    <div class="row justify-content-center">
                                <div class="mx-auto">
                                    <a href="{{ url_for("routes.home_route") }}">
                                        <img src="/assets/images/logo.png" alt="" height="24" />
                                        <h3 class="d-inline align-middle ml-1 text-logo">SASPanel</h3>
                                    </a>
                                </div>
                            <br><br><br>
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="header-title mt-0 mb-1">Default wizard</h4>
                                        <p class="sub-header">Example of Default wizard</p>
                                                                            {% if msg %}
                                    <div class="alert alert-{{ msg.error }} alert-dismissible fade show" role="alert">
                                        {{ msg.message }}
                                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                        <span aria-hidden="true">×</span>
                                    </button>
                                </div>
                                {% endif %}
                                        <form method="post" action="">
                                            <div class="p-3">
                                                    <div class="row">
                                                        <div class="col-12">
                                                            <div class="form-group">
                                                                <label for="sw-default-userName">Enter Database Root Password</label>
                                                                <input type="text" class="form-control" name="DBpass1" id="sw-default-userName" placeholder="Database Root Password">

                                                            </div>
                                                            <div class="form-group">
                                                                <label for="sw-default-password"> Retype Password</label>
                                                                <input type="text" id="sw-default-password" name="DBpass2" class="form-control" placeholder="ReType Password">
                                                            </div>
                                                        </div> <!-- end col -->
                                                    </div> <!-- end row -->
                                                    <div class="row">
                                                        <div class="col-12">
                                                            <div class="form-group">
                                                                <label for="sw-default-server-pass">Enter Domain</label>
                                                                <input type="text" id="sw-default-server-pass" name="domain" class="form-control" placeholder="Enter Domain">
                                                            </div>
                                                            <div class="form-group">
                                                                <label for="sw-default-server-pass">Enter Mail-Server Password</label>
                                                                <input type="text" id="sw-default-server-pass" name="mailserverpassword" class="form-control" placeholder="Enter Mail Server Password">
                                                            </div>
                                                            <div class="form-group">
                                                                <label for="sw-default-email-email">Enter Default Email</label>
                                                                <input type="text" id="sw-default-email-email" name="emailaddress"  class="form-control" placeholder="Prefix Only">
                                                            </div>

                                                            <div class="form-group">
                                                                <label for="sw-default-email-password">Enter Email Password</label>
                                                                <input type="text" id="sw-default-email-password" name="emailpassword" class="form-control" placeholder="Email Mail Password">
                                                            </div>
                                                        </div> <!-- end col -->
                                                    </div> <!-- end row -->
                                                    <div class="row">
                                                        <div class="col-12">
                                                            <div class="text-center">
                                                                <div class="mb-3">
                                                                    <i class="uil uil-check-square text-success h2"></i>
                                                                </div>
                                                                <h3>Click to Start Installtion !</h3>
                                                                <p class="w-75 mb-2 mx-auto text-muted">Click Install Wait for all Packages to be Installed and Reboot Server.</p>
                                                            </div>
                                                            <button class="btn btn-success btn-block" type="submit">Submit</button>
                                                        </div> <!-- end col -->
                                                    </div> <!-- end row -->
                                            </div>
                                            </form>
                                    </div>
                                </div>
                                <!-- end card -->
                            </div>
                </div>
            </div>
            <!-- end container -->
        </div>
        <!-- end account-pages -->

        <!-- Vendor js -->
        <script src="/assets/js/vendor.min.js"></script>

        <!-- App js -->
        <script src="/assets/js/app.min.js"></script>

        <script src="/assets/libs/smartwizard/jquery.smartWizard.min.js"></script>
        <script src="/assets/js/pages/form-wizard.init.js"></script>
        
    </body>
</html>
