{% include "layout/adminheader.html" %}
{% block body %}

            <div class="content-page">
                <div class="content">
                    
                    <!-- Start Content-->
                    <div class="container-fluid">
                        <div class="row page-title">
                            <div class="col-md-12">
                                <nav aria-label="breadcrumb" class="float-right mt-1">
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_dashboard") }}">Dashboard</a></li>
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_viewUser") }}">MYSQL Databases</a></li>
                                        <li class="breadcrumb-item active">Add new Databases</li>
                                    </ol>
                                </nav>
                                <h4 class="mb-1 mt-0">New DataBase</h4>
                            </div>
                        </div>


                            <div class="">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="header-title mt-0 mb-1">Add New Databases</h4>
                                        <p class="sub-header">
                                            Statement
                                        </p>

                                        <form role="form" class="parsley-examples">
                                            <div class="form-group row">
                                                <label for="Name" class="col-md-2 col-form-label">Database User<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                              <select name="dbUserType" class="custom-select md-2">
                                            <option selected="">Select DB user</option>
                                            <option value="User">User</option>
                                            <option value="Admin">Admin</option>
                                        </select>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="Name" class="col-md-2 col-form-label">Database Name<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="Text" required parsley-type="Text" class="form-control"
                                                            id="Name" name="name"placeholder="Database Name">
                                                </div>
                                            </div>


                                            <div class="form-group row">
                                                <div class="col-md-8 offset-md-4">
                                                    <button type="submit" class="btn btn-primary mr-1">
                                                        Add User
                                                    </button>
                                                    <button type="reset"
                                                            class="btn btn-secondary">
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div> <!-- end card -->

                            </div> <!-- end col -->
                        </div>
                        <!-- end row -->



{% include "layout/adminfooter.html" %}
{% endblock %}
