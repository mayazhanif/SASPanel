{% include "layout/adminheader.html" %}
{% block body %}

            <div class="content-page">
                <div class="content">
                    
                    <!-- Start Content-->
                    <div class="container-fluid">
                        <div class="row page-title">
                            <div class="col-md-12">
                                <nav aria-label="breadcrumb" class="float-right mt-1">
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_dashboard") }}">Dashboard</a></li>
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_viewUser") }}">Users</a></li>
                                        <li class="breadcrumb-item active">Modify</li>
                                    </ol>
                                </nav>
                                <h4 class="mb-1 mt-0">Update User Details</h4>
                            </div>
                        </div>


                            <div class="">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="header-title mt-0 mb-1">Modify user's Details</h4>
                                        <p class="sub-header">
                                            Statement
                                        </p>
    
                                        <form role="form" class="parsley-examples">
                                            <div class="form-group row">
                                                <label for="Name" class="col-md-2 col-form-label">Update Name<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="Text" required parsley-type="Text" class="form-control"
                                                            id="Name" name="name"placeholder="User Name">
                                                </div>
                                            </div>

                                            <div class="form-group row">
                                                <label for="Email" class="col-md-2 col-form-label">Update Email<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="email" required parsley-type="email" class="form-control"
                                                            id="Email" name="Email" placeholder="Enter Email">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="Password" class="col-md-2 col-form-label">Update Password<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input id="Password" name="pass1" type="password" placeholder="Enter Password" required
                                                            class="form-control">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="confirmPassword" class="col-md-2 col-form-label">Confirm Password
                                                    <span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input data-parsley-equalto="#Password" type="password" required
                                                            placeholder="ReType Password" name="pass2" class="form-control" id="confirmPassword">
                                                </div>
                                            </div>
                                                <div class="form-group row">
                                                <label for="confirmPassword" class="col-md-2 col-form-label">Update Package
                                                    <span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                  <select name="packageid" class="custom-select mb-2">
                                                     <option selected="">Select Package</option>
                                                     <option value="1">Default</option>
                                                     <option value="2">Demo</option>
                                                  </select>
                                                </div>
                                            </div>

                                            <div class="form-group row">
                                                <div class="col-md-8 offset-md-4">
                                                    <button type="submit" class="btn btn-primary mr-1">
                                                        Update User
                                                    </button>
                                                    <button type="reset"
                                                            class="btn btn-secondary">
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div> <!-- end card -->

                            </div> <!-- end col -->
                        </div>
                        <!-- end row -->



{% include "layout/adminfooter.html" %}
{% endblock %}
