{% include "layout/adminheader.html" %}
{% block body %}
            <div class="content-page">
                <div class="content">
                    <div class="container-fluid">
                        <div class="row page-title align-items-center">
                            <div class="col-sm-4 col-xl-6">
                                <h4 class="mb-1 mt-0">Dashboard</h4>
                            </div>
                        </div>

                        <!-- content -->
                        <div class="row">
                            <div class="col-md-6 col-xl-4">
                                <div class="card">
                                    <div class="card-body p-0">
                                        <div class="media p-3">
                                            <div class="media-body">
                                                <span class="text-muted text-uppercase font-size-12 font-weight-bold">Total
                                                    Ram Usage</span>
                                                <h2 id="memtext" class="mb-0">0/0</h2>
                                            </div>
                                            <div class="align-self-center">
                                                <div id="memchart" class="apex-charts"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6 col-xl-4">
                                <div class="card">
                                    <div class="card-body p-0">
                                        <div class="media p-3">
                                            <div class="media-body">
                                                <span class="text-muted text-uppercase font-size-12 font-weight-bold">
                                                    CPU Usage</span>
                                                <h2 id="cputext" class="mb-0">00</h2>
                                            </div>
                                            <div class="align-self-center">
                                                <div id="cpuchart" class="apex-charts"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6 col-xl-4">
                                <div class="card">
                                    <div class="card-body p-0">
                                        <div class="media p-3">
                                            <div class="media-body">
                                                <span class="text-muted text-uppercase font-size-12 font-weight-bold">New
                                                    Load Average</span>
                                                <h2 id="loadtext" class="mb-0">00</h2>
                                            </div>
                                            <div class="align-self-center">
                                                <div id="loadchart" class="apex-charts"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- stats + charts -->
                        <div class="row">
                            <div class="col-xl-3">
                                <div class="card">
                                    <div class="card-body p-0">
                                        <h5 class="card-title header-title border-bottom p-3 mb-0">CPU Details</h5>
                                        <!-- stat 1 -->
                                        <div class="media px-3 py-4 border-bottom">
                                            <div class="media-body">
                                                <h4 id="cpuname" class="mt-0 mb-1 font-size-22 font-weight-normal">Intel</h4>
                                                <span class="text-muted">CPU</span>
                                            </div>
                                            <i data-feather="users" class="align-self-center icon-dual icon-lg"></i>
                                        </div>

                                        <!-- stat 2 -->
                                        <div class="media px-3 py-4 border-bottom">
                                            <div class="media-body">
                                                <h4 id="systemname" class="mt-0 mb-1 font-size-22 font-weight-normal">Ubuntu</h4>
                                                <span class="text-muted">System</span>
                                            </div>
                                            <i data-feather="image" class="align-self-center icon-dual icon-lg"></i>
                                        </div>

                                        <!-- stat 3 -->
                                        <div class="media px-3 py-4">
                                            <div class="media-body">
                                                <h4 id="systemuptime" class="mt-0 mb-1 font-size-22 font-weight-normal">0 Days</h4>
                                                <span class="text-muted">Uptime</span>
                                            </div>
                                            <i data-feather="shopping-bag" class="align-self-center icon-dual icon-lg"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xl-6">
                                <div class="card">
                                    <div class="card-body pb-0">
                                        <ul class="nav card-nav float-right">
                                            <li class="nav-item">
                                                <a class="nav-link text-muted" href="#">Today</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link text-muted" href="#">7d</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link active" href="#">15d</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link text-muted" href="#">1m</a>
                                            </li>
                                            <li class="nav-item">
                                                <a class="nav-link text-muted" href="#">1y</a>
                                            </li>
                                        </ul>
                                        <h5 class="card-title mb-0 header-title">Revenue</h5>

                                        <div id="revenue-chart" class="apex-charts mt-3"  dir="ltr"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xl-3">
                                <div class="card">
                                    <div class="card-body pb-0">
                                        <h5 class="card-title header-title">Targets</h5>
                                        <div id="targets-chart" class="apex-charts mt-3" dir="ltr"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- row -->


                    </div>
                </div>

<script>
    setInterval(function(){
        get_updates()
        }, 5000);
function get_updates(){
    $.ajax({
      type:"get",
      url:"/get_updates",
        success:function(res)
        {
            console.log(res);
            //var loadCount = Math.round((res.load_average.one / res.load_average.max) * 100) > 100 ? 100 : Math.round((res.load_average.one / res.load_average.max) * 100);
            update_cart_ram(res.mem.memTotal,res.mem.memFree);
            update_cart_cpu(res.cpu_percentage);
            update_cart_load(res.cpu[0]);
            document.getElementById('cpuname').innerHTML=res.cpu[3];
            document.getElementById('systemname').innerHTML=res.system;
            document.getElementById('systemuptime').innerHTML=res.time;
        },
        error: function(xhr, status, error) {
        var err = eval("(" + xhr.responseText + ")");
        console.log(err);
        }
    });
}
function update_cart_ram(used, free){
        var totalram = used+free;
        var text = document.getElementById('memtext');
        text.innerHTML=used+"/"+totalram;
        var options = {
          series: [used, free],
          chart: {
          width: 250,
          height: 150,
          type: 'pie',
        },
        labels: ['Used', 'Free'],
            show: false,
            dataLabels: {
            enabled: false
            },
        };

        var chart = new ApexCharts(document.querySelector("#memchart"), options);
        chart.render();

}
function update_cart_cpu(load){
        total=100-load;
        console.log(load);
        var text = document.getElementById('cputext');
        text.innerHTML=load+"/"+total;
        var options = {
          series: [load, total],
          chart: {
          width: 250,
          height: 150,
          type: 'pie',
        },
        labels: ['CPU Load', 'Free'],
            show: false,
            dataLabels: {
            enabled: false
            },
        };
        var chart = new ApexCharts(document.querySelector("#cpuchart"), options);
        chart.render();
}
function update_cart_load(load){
        total=100-load;
        console.log(load);
        var text = document.getElementById('loadtext');
        text.innerHTML=load+"/"+total;
        var options = {
          series: [load, total],
          chart: {
          width: 250,
          height: 150,
          type: 'pie',
        },
        labels: ['Used', 'Free'],
            show: false,
            dataLabels: {
            enabled: false
            },
        };
        var chart = new ApexCharts(document.querySelector("#loadchart"), options);
        chart.render();

}
get_updates();
</script>
{% include "layout/adminfooter.html" %}
{% endblock %}
