{% include "layout/adminheader.html" %}
{% block body %}

            <div class="content-page">
                <div class="content">
                    
                    <!-- Start Content-->
                    <div class="container-fluid">
                        <div class="row page-title">
                            <div class="col-md-12">
                                <nav aria-label="breadcrumb" class="float-right mt-1">
                                    <ol class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_dashboard") }}">Dashboard</a></li>
                                        <li class="breadcrumb-item"><a href="{{url_for("routes.admin_viewUser") }}">Users</a></li>
                                        <li class="breadcrumb-item active">Add new Domain</li>
                                    </ol>
                                </nav>
                                <h4 class="mb-1 mt-0">New Domain</h4>
                            </div>
                        </div>


                            <div class="">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="header-title mt-0 mb-1">Add New Dokmain</h4>
                                        <p class="sub-header">
                                            Statement
                                        </p>
    
                                        <form role="form" class="parsley-examples">
                                            <div class="form-group row">
                                                <label for="Name" class="col-md-2 col-form-label">Name<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                     <select id="empselect" class="form-control selectpicker" data-live-search="true">
                                                         <option selected="">Select Package</option>
                                                     <option value="1">Default</option>
                                                     <option value="2">Demo</option>
                                                     </select>

                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label for="Domain" class="col-md-2 col-form-label">Domain Name<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="url" required="" parsley-type="url" class="form-control" id="Domain" placeholder="Enter Domain name">
                                                </div>
                                            </div>

                                            <div class="form-group row">
                                                <label for="Domain" class="col-md-2 col-form-label">Domain Directory<span class="text-danger">*</span></label>
                                                <div class="col-md-7">
                                                    <input type="url" required="" parsley-type="url" class="form-control" id="Domain" placeholder="Enter Domain name">
                                                </div>
                                            </div>
                                            <h4 class="header-title mt-0">Additional Options</h4>
                                            <div class="mt-3">
                                            <div class="custom-control custom-checkbox mb-2">
                                                <input type="checkbox" class="custom-control-input" name="createFTP" id="createFTP">
                                                <label class="custom-control-label" for="createFTP">Create FTP</label>
                                            </div>
                                            <div class="custom-control custom-checkbox mb-2">
                                                <input type="checkbox" class="custom-control-input" id="customCheck2">
                                                <label class="custom-control-label" for="customCheck2">Create Default Mail</label>
                                            </div>
                                                <div class="custom-control custom-checkbox mb-2">
                                                <input type="checkbox" class="custom-control-input" name="createFTP" id="createFTP">
                                                <label class="custom-control-label" for="createFTP">Create FTP</label>
                                            </div>
                                        </div>
                                            <div class="form-group row">
                                                <div class="col-md-8 offset-md-4">
                                                    <button type="submit" class="btn btn-primary mr-1">
                                                        Add Domain Name
                                                    </button>
                                                    <button type="reset"
                                                            class="btn btn-secondary">
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div> <!-- end card -->

                            </div> <!-- end col -->
                        </div>
                        <!-- end row -->



{% include "layout/adminfooter.html" %}
