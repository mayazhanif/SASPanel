    </main>
    <!-- End Content -->

  </div>
  <!-- ══════════════ END MAIN ══════════════ -->

</div>

<script>
// Sidebar collapse toggle
(function() {
  var sidebar = document.getElementById('sp-sidebar');
  var toggle  = document.getElementById('sp-toggle');
  var PREF_KEY = 'sp_sidebar_collapsed';

  // Restore saved state
  if (localStorage.getItem(PREF_KEY) === '1') {
    sidebar.classList.add('collapsed');
  }

  if (toggle) {
    toggle.addEventListener('click', function() {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem(PREF_KEY, sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }

  // Set breadcrumb active page name from the active nav item
  var activeItem = document.querySelector('.sp-nav-item.active span');
  var pageName = document.getElementById('sp-page-name');
  if (activeItem && pageName) {
    pageName.textContent = activeItem.textContent.replace('↗', '').trim();
  }

  // Mobile overlay close
  document.addEventListener('click', function(e) {
    if (window.innerWidth <= 768 &&
        !sidebar.contains(e.target) &&
        e.target !== toggle &&
        sidebar.classList.contains('mobile-open')) {
      sidebar.classList.remove('mobile-open');
    }
  });
})();

// Tab system (pure JS, no jQuery)
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.sp-tab[data-tab]').forEach(function(tab) {
    tab.addEventListener('click', function(e) {
      e.preventDefault();
      var target = this.dataset.tab;
      var container = this.closest('.sp-tab-container') || document;
      container.querySelectorAll('.sp-tab').forEach(function(t) { t.classList.remove('active'); });
      container.querySelectorAll('.sp-tab-panel').forEach(function(p) { p.classList.remove('active'); });
      this.classList.add('active');
      var panel = container.querySelector('#' + target);
      if (panel) panel.classList.add('active');
    });
  });

  // Auto-open tab from URL hash
  if (window.location.hash) {
    var hashTab = document.querySelector('.sp-tab[data-tab="' + window.location.hash.slice(1) + '"]');
    if (hashTab) hashTab.click();
  }
});
</script>
</body>
</html>
